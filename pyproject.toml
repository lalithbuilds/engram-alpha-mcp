[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram-alpha-mcp"
version = "2.1.0"
description = "Engram Alpha: Sovereign Semantic Graph MCP Memory Engine with Hardware AMX & 4-Way RRF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "pyzmq>=25.0.0",
    "fastembed>=0.4.0",
    "sqlite-vec>=0.1.1",
    "numpy>=1.24.0",
    "onnxruntime>=1.15.0",
    "tokenizers>=0.19.0",
    "pysqlite3-binary>=0.5.2; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
]

[project.scripts]
engram = "engram.cli:main"
engram-mcp = "engram.server:main"
engram-alpha-mcp = "engram.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

