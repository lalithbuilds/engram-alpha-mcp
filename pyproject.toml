[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram"
version = "2.0.0"
description = "Engram Alpha: Zero-dependency Semantic Graph MCP Memory Server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
local = [
    "sqlite-vec>=0.1.1",
    "onnxruntime>=1.15.0",
    "huggingface-hub>=0.23.0",
    "platformdirs>=4.0.0",
    "tokenizers>=0.19.0"
]
mac = [
    "pysqlite3-binary>=0.5.2"
]
all = [
    "engram[local,mac]"
]

[project.scripts]
engram = "engram.cli:main"
engram-mcp = "engram.server:main"
