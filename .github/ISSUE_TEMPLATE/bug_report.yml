name: "🐛 Bug Report"
description: "Report a bug, crash, or unexpected behavior in Engram Alpha MCP"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with Engram Alpha!
  - type: input
    id: version
    attributes:
      label: Engram Alpha Version
      description: What version are you running? (e.g. 2.1.0, uvx latest)
      placeholder: "2.1.0"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP Client
      description: Which client is connecting to Engram Alpha?
      options:
        - Claude Desktop
        - Cursor IDE
        - Windsurf Editor
        - Cline / Roo Code
        - Zed
        - Custom Python Script
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon M-Series)
        - macOS (Intel x86_64)
        - Linux (Ubuntu/Debian)
        - Windows 10/11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Start MCP with `uvx engram-alpha-mcp`
        2. Execute tool `save_memory`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal / MCP Logs
      description: Please copy and paste any relevant stderr output or logs.
      render: shell
